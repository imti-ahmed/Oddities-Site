# Fills the board from our list of companies and job sites, using the Groq AI, and saves into the Neon database.
# Looks for NEW jobs every 3 days at 04:00 India time (22:30 UTC the evening before), and you can run it by hand: GitHub > Actions > "Collect jobs" > Run workflow.
# Reading the company boards costs no AI. The AI only sees jobs it has not seen before, about 8 jobs per call.
#
# It needs two secrets (GitHub > Settings > Secrets and variables > Actions > New repository secret):
#   GROQ_API_KEY   your Groq key
#   DATABASE_URL   your Neon connection string
# (These are the same two values that are in your Vercel settings. They are never written into the code.)
name: Collect jobs

on:
  workflow_dispatch:
    inputs:
      start_fresh:
        description: 'FIRST delete every listed job (the board starts empty)'
        type: boolean
        default: false
      prune_old:
        description: 'FIRST hide every job that came from a company or site no longer on our lists (jobs added by hand are kept)'
        type: boolean
        default: false
      max_checks:
        description: 'How many new jobs may be settled in this run'
        default: '400'
  schedule:
    - cron: '30 22 */3 * *'      # 22:30 UTC = 04:00 IST the next morning (GitHub uses UTC)

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # a low Groq per-minute limit makes a run slow (it waits between AI calls), so give it plenty of time
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, dom, libxml, pdo_pgsql, simplexml
      - name: Collect jobs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_CHECKS: ${{ inputs.max_checks || '400' }}
          START_FRESH: ${{ inputs.start_fresh && 'yes' || 'no' }}
          PRUNE_OLD: ${{ inputs.prune_old && 'yes' || 'no' }}
        run: |
          ARGS="--max=$MAX_CHECKS"
          if [ "$START_FRESH" = "yes" ]; then ARGS="--fresh --yes $ARGS"; fi
          if [ "$PRUNE_OLD" = "yes" ]; then ARGS="--prune --yes $ARGS"; fi
          php scripts/collect.php $ARGS
